<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with slightly warm dark neutral -->
  <rect width="512" height="512" rx="120" fill="#121214" />
  
  <!-- Outer glassmorphic-style soft outline -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- Center Clapperboard -->
  <g transform="translate(96, 112)">
    <!-- Main base container -->
    <rect x="0" y="100" width="320" height="190" rx="20" fill="#1a1a1e" stroke="#ffffff" stroke-width="10" />
    
    <!-- Angled Clapper Stick (Top part) -->
    <g transform="rotate(-14, 20, 100)">
      <!-- Top stick body -->
      <rect x="0" y="44" width="320" height="46" rx="8" fill="#1a1a1e" stroke="#ffffff" stroke-width="10" />
      <!-- High contrast white stripes -->
      <path d="M50,44 L85,90 M130,44 L165,90 M210,44 L245,90 M290,44 L315,90" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    </g>
    
    <!-- Stationary Clapper Stick (Middle part) -->
    <rect x="0" y="100" width="320" height="34" fill="#1a1a1e" stroke="#ffffff" stroke-width="10" />
    <!-- Matching base stripes -->
    <path d="M50,100 L85,134 M130,100 L165,134 M210,100 L245,134" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Screw / Joint hinge -->
    <circle cx="20" cy="110" r="18" fill="#ffffff" />
    <circle cx="20" cy="110" r="8" fill="#121214" />

    <!-- Technical Board markings (Production, Scene, Take style lines) -->
    <line x1="45" y1="185" x2="275" y2="185" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <line x1="45" y1="230" x2="135" y2="230" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <line x1="185" y1="230" x2="275" y2="230" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
